[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odds-arbitrage-alerts"
version = "0.1.0"
description = "Arbitrage and price-move alerts across bookmakers from Oddschecker, in Slack, Discord, Telegram or a webhook, on a GitHub Actions schedule."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ScrapeUnblocker" }]
keywords = [
    "oddschecker",
    "odds",
    "arbitrage",
    "sports-betting",
    "price-alert",
    "slack",
    "discord",
    "telegram",
    "github-actions",
    "scrapeunblocker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "scrapeunblocker>=0.18.6,<1",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://www.scrapeunblocker.com/scrapers/oddschecker?utm_source=github&utm_medium=integration&utm_campaign=example-repos"
Documentation = "https://docs.scrapeunblocker.com/?utm_source=github&utm_medium=integration&utm_campaign=example-repos"
Repository = "https://github.com/ScrapeUnblocker/odds-arbitrage-alerts"
Issues = "https://github.com/ScrapeUnblocker/odds-arbitrage-alerts/issues"

[project.scripts]
odds-arbitrage-alerts = "odds_arbitrage_alerts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
